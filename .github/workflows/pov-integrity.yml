name: POV integrity tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run POV decision matrix
        run: python test_pov_decision_matrix.py
      - name: Complete audit, export, SQL source and agent regression tests
        run: python -m unittest test_complete_audit test_xlsx_export test_vehicle_technical test_agent_authorization test_agent_schedule test_sync_resilience test_portable_agent_startup test_personal_accounts test_web_login
      - name: Browser behavior regression tests
        run: |
          node test_xlsx_progress.js
          node test_followup_groups.js
          node test_vehicle_technical.js
