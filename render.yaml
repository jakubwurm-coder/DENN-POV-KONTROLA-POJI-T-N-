services:
  - type: web
    name: denni-pov-kontrola
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: denni-pov-data
          property: connectionString
